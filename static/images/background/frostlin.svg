<svg width="1600" height="900"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Frost Purple -->
<linearGradient id="surface"
x1="0" y1="0"
x2="1" y2="1">

<stop offset="0%"
stop-color="#8175B5"
stop-opacity="0.05"/>

<stop offset="100%"
stop-color="#8175B5"
stop-opacity="0.35"/>

</linearGradient>


<radialGradient id="node">
<stop offset="0%"
stop-color="#8175B5"
stop-opacity="0.7"/>

<stop offset="100%"
stop-color="#8175B5"
stop-opacity="0.1"/>
</radialGradient>


</defs>


<!-- ================= -->
<!-- 曲率网格 -->
<!-- ================= -->


<g fill="none"
stroke="#8175B5"
stroke-opacity="0.18">


<!-- 横向曲线 -->

<path d="
M100 200
C350 50 650 120 900 250
C1150 380 1350 250 1550 120
"/>


<path d="
M80 300
C350 150 700 220 950 360
C1200 500 1400 350 1580 230
"/>


<path d="
M50 420
C400 250 700 380 1000 500
C1250 600 1450 450 1600 350
"/>


<path d="
M30 550
C350 400 650 550 950 650
C1200 730 1450 600 1600 500
"/>


<path d="
M50 700
C400 550 700 720 1000 760
C1300 820 1450 700 1600 650
"/>


<!-- 纵向曲线 -->


<path d="
M250 50
C150 300 250 500 180 850
"/>


<path d="
M500 20
C400 300 600 500 450 880
"/>


<path d="
M800 0
C650 300 900 600 750 900
"/>


<path d="
M1100 30
C950 300 1200 600 1050 850
"/>


<path d="
M1400 80
C1250 350 1450 600 1350 820
"/>


</g>



<!-- ================= -->
<!-- 网络连线 -->
<!-- ================= -->


<g stroke="#8175B5"
stroke-opacity="0.22">


<line x1="350" y1="320"
x2="600" y2="450"/>

<line x1="600" y1="450"
x2="900" y2="300"/>

<line x1="900" y1="300"
x2="1200" y2="430"/>

<line x1="900" y1="300"
x2="1050" y2="650"/>

<line x1="1200" y1="430"
x2="1400" y2="600"/>


</g>



<!-- ================= -->
<!-- 网络节点 -->
<!-- ================= -->


<g fill="url(#node)">


<circle cx="350"
cy="320"
r="18"/>


<circle cx="600"
cy="450"
r="25"/>


<circle cx="900"
cy="300"
r="22"/>


<circle cx="1200"
cy="430"
r="20"/>


<circle cx="1050"
cy="650"
r="15"/>


<circle cx="1400"
cy="600"
r="18"/>


</g>


</svg>